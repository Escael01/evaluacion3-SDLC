name: EVA3 - Docker Build & Push

on:
  push:
    branches: [ "main" ]  # Solo se ejecutará cuando haya un push a la rama 'main'
  # pull_request:
  #   branches: [ "main" ]  # Desactivado para evitar ejecuciones innecesarias

jobs:
  docker-build:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/evaluacion3-sdlc:latest


