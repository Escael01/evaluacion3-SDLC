name: Examen Final Transversal (EFT) - QA & Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # ETAPA 1: QA & Seguridad (EVA2)
  qa-seguridad:
    name: ETAPA 1: QA & Seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies & Audit (npm ci)
        run: npm ci

      - name: Run Unit Tests & Coverage (EVA2)
        run: npm run test:coverage
        env:
          CI: true

      - name: Run npm audit
        run: npm audit --audit-level=critical

      - name: Setup SonarCloud Scanner
        uses: SonarSource/sonarcloud-github-action@v2.4.0
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Snyk Security Analysis (EVA2)
        uses: snyk/actions/node@v1
        continue-on-error: false
        env:

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image (EVA3)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/evaluacion3-sdlc:latest

      - name: Docker Scout Security Analysis
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKERHUB_USERNAME }}/evaluacion3-sdlc:latest
          only-severities: critical,high
          ignore-policy: true

      - name: Deploy Simulado (EFT Requirement)
        run: |
          echo "Deploy simulado a entorno PRD exitoso." > deploy-success.txt
          echo "Job Finished: $(date)" >> deploy-success.txt
          cat deploy-success.txt      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

  # ETAPA 2: Build, Push & Deploy (EVA3)
    needs: [qa-seguridad] # ESTO ES LO CRÍTICO: SOLO SE EJECUTA SI LA ETAPA 1 PASA

  build-deploy:
    name: ETAPA 2: Build & Deploy
    runs-on: ubuntu-latest

